  /api/v1/Content:
    get:
      tags:
        - Content
      parameters:
        - name: ParentEmail
          in: query
          description:
            Filter content by parent email address. Use this to get only
            content relevant to students under a specific parent. This is a
            student related filter which means this filters entities related to
            some student.
          schema:
            type: string
        - name: TeacherId
          in: query
          description:
            Teacher account id. This returns only students who are enrolled in
            classes taught by the specified teacher's account id. Please be
            aware that there is a difference between AccountId and TeacherId.
            This is a student related filter which means this filters entities
            related to some student.
          schema:
            type: integer
            format: int32
        - name: BranchId
          in: query
          description:
            Filter content by branch identifier. This is a student related
            filter which means this filters entities related to some student.
          schema:
            type: integer
            format: int32
        - name: ClassId
          in: query
          description:
            Filter content by class identifier. This is a student related
            filter which means this filters entities related to some student.
          schema:
            type: integer
            format: int32
        - name: StudentId
          in: query
          description:
            Filter content by specific student identifier. This is a student
            related filter which means this filters entities related to some
            student.
          schema:
            type: integer
            format: int32
        - name: AccountId
          in: query
          description:
            Filter content by specific student account id. This is a student
            related filter which means this filters entities related to some
            student.
          schema:
            type: integer
            format: int32
        - name: LevelId
          in: query
          description:
            Filter content by level identifier. This is a student related
            filter which means this filters entities related to some student.
          schema:
            type: integer
            format: int32
        - name: StudentNameSearch
          in: query
          description:
            Search for students by name using case-insensitive substring
            matching. This is a student related filter which means this filters
            entities related to some student.
          schema:
            type: string
        - name: ContentTypes
          in: query
          description:
            Filter Content by ContentType.<br /><br /> Use the Int Value in
            this field:<br /><table><tr><th>Int
            Value</th><th>EnumValue</th></tr><tr><td>0</td><td>Moments</td></tr><tr><td>1</td><td>Newsfeeds</td></tr><tr><td>2</td><td>Broadcasts</td></tr><tr><td>3</td><td>CheckInOuts</td></tr><tr><td>4</td><td>Documents</td></tr><tr><td>5</td><td>ProfilePhoto</td></tr><tr><td>6</td><td>Visitors</td></tr></table><br
            /> Visit ContentTypeEnum for more details.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ContentTypeEnum"
        - name: ContentSearch
          in: query
          description: Searches case-insensitive substring in ContentTitle and ContentBody.
          schema:
            type: string
        - name: LearningDomainId
          in: query
          description: Filter Content by LearningDomainId.
          schema:
            type: integer
            format: int32
        - name: Page
          in: query
          schema:
            type: integer
            format: int32
        - name: PageSize
          in: query
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResultOfContentApiDto"
        "401":
          description: Unauthorized - Authentication required
        "403":
          description: Forbidden - Insufficient permissions
