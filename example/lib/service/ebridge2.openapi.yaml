openapi: 3.0.1
info:
  title: ACADEMICA API
  description: API for ACADEMICA system using OpenAPI 3.0 - Version v1.0
  contact:
    name: ACADEMICA Development Team
    email: dev@academica.com
  version: v1.0
servers:
  - url: https://api-uat.e-bridge.edu.sg/
paths:
  /api/v1/Enums:
    get:
      tags:
        - Enum
      summary: Gets all Enums
      description: Returns all the available enums with their list of values
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          description: Unauthorized - Authentication required
        "403":
          description: Forbidden - Insufficient permissions
  /api/v1/Enums/names:
    get:
      tags:
        - Enum
      summary: Get list of enum names
      description:
        Returns all the names of enums. Values returned here can be use for
        `enumValues/values/{enumName}` endpoint
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          description: Unauthorized - Authentication required
        "403":
          description: Forbidden - Insufficient permissions
  /api/v1/Enums/values/{EnumName}:
    get:
      tags:
        - Enum
      summary: Get values of a specific enum
      description: Returns all the value of the specified enum
      parameters:
        - name: EnumName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnumObject"
        "401":
          description: Unauthorized - Authentication required
        "403":
          description: Forbidden - Insufficient permissions
  /api/v1/Branch:
    get:
      tags:
        - Branch
      parameters:
        - name: Page
          in: query
          schema:
            type: integer
            format: int32
        - name: PageSize
          in: query
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
