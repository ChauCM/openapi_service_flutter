  /api/v1/Student:
    get:
      tags:
        - Student
      parameters:
        - name: ParentEmail
          in: query
          description:
            Filter content by parent email address. Use this to get only
            content relevant to students under a specific parent. This is a
            student related filter which means this filters entities related to
            some student.
          schema:
            type: string
        - name: TeacherId
          in: query
          description:
            Teacher account id. This returns only students who are enrolled in
            classes taught by the specified teacher's account id. Please be
            aware that there is a difference between AccountId and TeacherId.
            This is a student related filter which means this filters entities
            related to some student.
          schema:
            type: integer
            format: int32
        - name: BranchId
          in: query
          description:
            Filter content by branch identifier. This is a student related
            filter which means this filters entities related to some student.
          schema:
            type: integer
            format: int32
        - name: ClassId
          in: query
          description:
            Filter content by class identifier. This is a student related
            filter which means this filters entities related to some student.
          schema:
            type: integer
            format: int32
        - name: StudentId
          in: query
          description:
            Filter content by specific student identifier. This is a student
            related filter which means this filters entities related to some
            student.
          schema:
            type: integer
            format: int32
        - name: AccountId
          in: query
          description:
            Filter content by specific student account id. This is a student
            related filter which means this filters entities related to some
            student.
          schema:
            type: integer
            format: int32
        - name: LevelId
          in: query
          description:
            Filter content by level identifier. This is a student related
            filter which means this filters entities related to some student.
          schema:
            type: integer
            format: int32
        - name: StudentNameSearch
          in: query
          description:
            Search for students by name using case-insensitive substring
            matching. This is a student related filter which means this filters
            entities related to some student.
          schema:
            type: string
        - name: Page
          in: query
          schema:
            type: integer
            format: int32
        - name: PageSize
          in: query
          schema:
            type: integer
            format: int32
