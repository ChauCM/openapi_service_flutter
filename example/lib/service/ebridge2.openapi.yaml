      parameters:
        - name: StartDate
          in: query
          description:
            Full-date notation as defined by RFC 3339, section 5.6, for
            example, 2017-07-21.<br /><br /> This ensures that the attendance is
            at least created on or after this date. If both StartDate and
            EndDate are provided, the attendance must be created within this
            range.
          required: true
          schema:
            type: string
            format: date
        - name: EndDate
          in: query
          description:
            Full-date notation as defined by RFC 3339, section 5.6, for
            example, 2017-07-21.<br /><br /> This ensures that the attendance is
            at most created on or before this date. If both StartDate and
            EndDate are provided, the attendance must be created within this
            range.
          required: true
          schema:
            type: string
            format: date
        - name: ParentEmail
          in: query
          description:
